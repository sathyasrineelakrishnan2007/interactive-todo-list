
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef4ff;
    margin: 0;
    padding: 30px 15px;
    color: #172033;
}

.container {
    max-width: 550px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000012;
}

h1 {
    text-align: center;
    color: #102a56;
}

.subtitle {
    text-align: center;
    color: #64748b;
}

.input-area {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

button {
    border: none;
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.add-btn {
    background: #2563eb;
    color: white;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #f1f5f9;
    border-radius: 8px;
}

.task-text {
    flex: 1;
    overflow-wrap: anywhere;
}

.completed .task-text {
    text-decoration: line-through;
    color: #64748b;
}

.complete-btn {
    background: #dcfce7;
    color: #166534;
}

.delete-btn {
    background: #fee2e2;
    color: #b91c1c;
}

#message {
    text-align: center;
    color: #64748b;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin-top: 25px;
}

@media (max-width: 450px) {
    .container {
        padding: 18px;
    }

    .input-area {
        flex-direction: column;
    }

    .input-area button {
        width: 100%;
    }

    li {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Plan your tasks and stay organized!</p>

    <div class="input-area">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
            aria-label="New task"
        >
        <button class="add-btn" id="addBtn">Add Task</button>
    </div>

    <p id="message" aria-live="polite">No tasks yet. Add your first task!</p>
    <ul id="taskList"></ul>

    <footer>Tasks are saved in your browser automatically.</footer>
</div>

<script>
const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const message = document.getElementById("message");

let tasks = [];

try {
    tasks = JSON.parse(localStorage.getItem("myTasks")) || [];
    if (!Array.isArray(tasks)) tasks = [];
} catch (error) {
    tasks = [];
}

function saveTasks() {
    localStorage.setItem("myTasks", JSON.stringify(tasks));
}

function renderTasks() {
    taskList.replaceChildren();

    tasks.forEach(function(task) {
        const li = document.createElement("li");

        if (task.completed) {
            li.classList.add("completed");
        }

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const completeBtn = document.createElement("button");
        completeBtn.className = "complete-btn";
        completeBtn.textContent = task.completed ? "Undo" : "Complete";

        completeBtn.addEventListener("click", function() {
            task.completed = !task.completed;
            saveTasks();
            renderTasks();
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Delete";

        deleteBtn.addEventListener("click", function() {
            tasks = tasks.filter(function(item) {
                return item.id !== task.id;
            });

            saveTasks();
            renderTasks();
        });

        li.append(text, completeBtn, deleteBtn);
        taskList.appendChild(li);
    });

    message.textContent = tasks.length === 0
        ? "No tasks yet. Add your first task!"
        : tasks.filter(task => task.completed).length +
          " of " + tasks.length + " tasks completed.";
}

function addTask() {
    const text = taskInput.value.trim();

    if (text === "") {
        message.textContent = "Please enter a task first.";
        taskInput.focus();
        return;
    }

    tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        completed: false
    });

    saveTasks();
    renderTasks();

    taskInput.value = "";
    taskInput.focus();
}

addBtn.addEventListener("click", addTask);

taskInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        addTask();
    }
});

renderTasks();
</script>

</body>
</html>
